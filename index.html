<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Order Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080E;
    --surface:#131320;
    --surface-hi:#1C1C2E;
    --border:rgba(255,255,255,0.08);
    --border-hi:rgba(255,255,255,0.14);
    --text:#F3F2FF;
    --text-dim:#9391B5;
    --violet:#8B6BFF;
    --violet-soft:rgba(139,107,255,0.16);
    --cyan:#37E8D9;
    --cyan-soft:rgba(55,232,217,0.14);
    --pink:#FF5FA8;
    --pink-soft:rgba(255,95,168,0.14);
    --amber:#FFC24B;
    --amber-soft:rgba(255,194,75,0.14);
    --green:#3FE38A;
    --green-soft:rgba(63,227,138,0.14);
    --red:#FF5C6C;
    --red-soft:rgba(255,92,108,0.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);}
  body{
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    padding-bottom:86px;
  }
  .display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  .glow{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none;z-index:0;}
  .glow-1{width:260px;height:260px;top:-100px;left:-80px;background:var(--violet);}
  .glow-2{width:220px;height:220px;top:60px;right:-90px;background:var(--cyan);opacity:.22;}

  .app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 16px 0;}

  header{padding:6px 2px 20px;}
  .brand-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:38px;height:38px;border-radius:12px;
    background:linear-gradient(135deg,var(--violet),var(--pink));
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk';font-weight:700;font-size:15px;
    box-shadow:0 4px 20px rgba(139,107,255,.35);
  }
  .brand-name{font-family:'Space Grotesk';font-weight:700;font-size:19px;letter-spacing:-0.01em;}
  .icon-btn{
    width:38px;height:38px;border-radius:12px;background:var(--surface);
    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);font-size:16px;cursor:pointer;
  }
  .icon-btn:active{transform:scale(0.94);}

  .conn{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--surface);border:1px solid var(--border);
    padding:6px 12px 6px 9px;border-radius:100px;font-size:12px;font-weight:500;
    color:var(--text-dim);
  }
  .conn.ok{color:var(--green);border-color:rgba(63,227,138,.25);background:var(--green-soft);}
  .conn.err{color:var(--red);border-color:rgba(255,92,108,.25);background:var(--red-soft);}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .stats{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scroll-snap-type:x mandatory;}
  .stats::-webkit-scrollbar{display:none;}
  .stat-card{scroll-snap-align:start;min-width:132px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 15px;position:relative;overflow:hidden;}
  .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px;}
  .stat-card.c-violet::before{background:linear-gradient(90deg,var(--violet),transparent);}
  .stat-card.c-green::before{background:linear-gradient(90deg,var(--green),transparent);}
  .stat-card.c-amber::before{background:linear-gradient(90deg,var(--amber),transparent);}
  .stat-card.c-pink::before{background:linear-gradient(90deg,var(--pink),transparent);}
  .stat-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);margin-bottom:8px;font-weight:600;}
  .stat-value{font-family:'Space Grotesk';font-weight:700;font-size:22px;letter-spacing:-0.01em;}
  .stat-sub{font-size:10.5px;color:var(--text-dim);margin-top:4px;font-family:'JetBrains Mono';}

  .search-wrap{margin:16px 2px 4px;position:relative;}
  .search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px 12px 40px;color:var(--text);font-size:14px;font-family:'Inter';}
  .search::placeholder{color:var(--text-dim);}
  .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:14px;}

  .segs{display:flex;gap:6px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none;}
  .segs::-webkit-scrollbar{display:none;}
  .seg{flex-shrink:0;padding:8px 15px;border-radius:100px;font-size:12.5px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;transition:all .15s;}
  .seg.active{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(139,107,255,.3);}

  .view{display:none;padding:6px 2px 10px;}
  .view.active{display:block;}

  .section-label{font-family:'Space Grotesk';font-weight:600;font-size:13px;color:var(--text-dim);margin:14px 2px 10px;text-transform:uppercase;letter-spacing:.06em;}

  .order-list{display:flex;flex-direction:column;gap:9px;}
  .order-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;}
  .order-avatar{width:42px;height:42px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:13px;background:var(--violet-soft);color:var(--violet);}
  .order-mid{flex:1;min-width:0;}
  .order-phone{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .order-meta{font-size:11.5px;color:var(--text-dim);margin-top:2px;font-family:'JetBrains Mono';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .order-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
  .order-amount{font-family:'JetBrains Mono';font-weight:600;font-size:13.5px;}
  .pill{font-size:10px;font-weight:700;padding:4px 9px;border-radius:100px;letter-spacing:.03em;text-transform:uppercase;}
  .pill-completed{background:var(--green-soft);color:var(--green);}
  .pill-processing{background:var(--cyan-soft);color:var(--cyan);}
  .pill-pending{background:var(--amber-soft);color:var(--amber);}
  .pill-failed, .pill-unknown{background:var(--red-soft);color:var(--red);}
  .order-time{font-size:10px;color:var(--text-dim);font-family:'JetBrains Mono';}

  .empty, .loading{text-align:center;padding:50px 20px;color:var(--text-dim);font-size:13px;}
  .error-box{background:var(--red-soft);border:1px solid rgba(255,92,108,.25);border-radius:14px;padding:16px;color:var(--red);font-size:12px;font-family:'JetBrains Mono';line-height:1.7;white-space:pre-wrap;margin:6px 2px;}

  .feed-list{display:flex;flex-direction:column;gap:0;}
  .fe{display:flex;gap:12px;padding:12px 2px;}
  .fe-rail{display:flex;flex-direction:column;align-items:center;width:10px;flex-shrink:0;}
  .fe-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0;box-shadow:0 0 8px currentColor;}
  .fe-line{width:1.5px;flex:1;background:var(--border);margin-top:6px;}
  .fe-bubble{background:var(--surface);border:1px solid var(--border);border-radius:14px 14px 14px 4px;padding:11px 14px;font-size:13px;line-height:1.5;flex:1;}
  .fe-bubble b{color:var(--text);}
  .fe-foot{display:flex;justify-content:space-between;margin-top:6px;padding:0 3px;}
  .fe-tag{font-size:10.5px;color:var(--violet);font-weight:600;}
  .fe-id{font-size:10px;color:var(--text-dim);font-family:'JetBrains Mono';}

  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
  .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;}
  .kpi-label{font-size:11px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
  .kpi-value{font-family:'Space Grotesk';font-weight:700;font-size:24px;}
  .bar-wrap{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-top:10px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-label{width:80px;font-size:11.5px;color:var(--text-dim);flex-shrink:0;}
  .bar-track{flex:1;height:8px;background:var(--surface-hi);border-radius:100px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:100px;}
  .bar-num{width:32px;text-align:right;font-family:'JetBrains Mono';font-size:11.5px;color:var(--text-dim);flex-shrink:0;}

  .bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top, var(--bg) 60%, transparent);}
  .nav-inner{display:flex;gap:4px;background:rgba(19,19,32,0.85);backdrop-filter:blur(20px);border:1px solid var(--border-hi);border-radius:18px;padding:6px;width:100%;max-width:520px;}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border-radius:13px;color:var(--text-dim);cursor:pointer;font-size:10.5px;font-weight:600;transition:all .15s;}
  .nav-btn .ic{font-size:18px;}
  .nav-btn.active{background:var(--violet-soft);color:var(--violet);}

  @media (min-width:600px){ .app{padding-top:26px;} }
</style>
</head>
<body>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<div class="app">
  <header>
    <div class="brand-row">
      <div class="brand">
        <div class="brand-mark">OD</div>
        <div class="brand-name">Order Desk</div>
      </div>
      <div class="icon-btn" id="refreshBtn">⟳</div>
    </div>
    <div id="connStatus"><span class="conn"><span class="dot"></span>Connecting…</span></div>
  </header>

  <div class="stats" id="statsRow">
    <div class="stat-card c-violet">
      <div class="stat-label">Today</div>
      <div class="stat-value mono" id="statOrders">—</div>
      <div class="stat-sub" id="statOrdersSub">of last 100</div>
    </div>
    <div class="stat-card c-green">
      <div class="stat-label">Completed</div>
      <div class="stat-value mono" id="statPaid">—</div>
      <div class="stat-sub" id="paidRate">—</div>
    </div>
    <div class="stat-card c-amber">
      <div class="stat-label">Pending</div>
      <div class="stat-value mono" id="statPending">—</div>
      <div class="stat-sub" id="pendingRate">—</div>
    </div>
    <div class="stat-card c-pink">
      <div class="stat-label">Revenue</div>
      <div class="stat-value mono" id="statRevenue">—</div>
      <div class="stat-sub">completed only</div>
    </div>
  </div>

  <div class="view active" id="view-orders">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input class="search" id="searchBox" placeholder="Search phone or ref…">
    </div>
    <div class="segs" id="segs">
      <div class="seg active" data-filter="all">All</div>
      <div class="seg" data-filter="today">Today</div>
      <div class="seg" data-filter="completed">Completed</div>
      <div class="seg" data-filter="processing">Processing</div>
      <div class="seg" data-filter="pending">Pending</div>
    </div>
    <div class="order-list" id="ledger"><div class="loading">Loading orders…</div></div>
  </div>

  <div class="view" id="view-activity">
    <div class="section-label">Bot activity</div>
    <div class="feed-list" id="feed"><div class="loading">Loading…</div></div>
  </div>

  <div class="view" id="view-stats">
    <div class="section-label">Overview</div>
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Total orders</div>
        <div class="kpi-value mono" id="kpiTotal">—</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Completion rate</div>
        <div class="kpi-value mono" id="kpiRate">—</div>
      </div>
    </div>
    <div class="bar-wrap" id="statusBars"></div>
  </div>
</div>

<div class="bottomnav">
  <div class="nav-inner">
    <div class="nav-btn active" data-view="orders"><span class="ic">▤</span>Orders</div>
    <div class="nav-btn" data-view="activity"><span class="ic">◈</span>Activity</div>
    <div class="nav-btn" data-view="stats"><span class="ic">◔</span>Stats</div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = '__SUPABASE_URL__';
const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let orders = [];
let currentFilter = 'all';

function setConn(kind, msg){
  const cls = kind === 'ok' ? 'ok' : kind === 'err' ? 'err' : '';
  document.getElementById('connStatus').innerHTML = `<span class="conn ${cls}"><span class="dot"></span>${msg}</span>`;
}
function pillClass(s){
  s=(s||'').toLowerCase();
  return ['completed','processing','pending'].includes(s) ? 'pill-'+s : 'pill-unknown';
}
function pillLabel(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : 'Unknown'; }
function initials(phone){ const c=(phone||'').replace(/\D/g,''); return c ? c.slice(-2) : '??'; }
function money(n){ const v=Number(n)||0; return 'GH₵'+v.toLocaleString('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function timeAgo(ts){
  if(!ts) return '';
  const d = new Date(ts);
  if(isNaN(d)) return '';
  const mins = Math.floor((Date.now()-d.getTime())/60000);
  if(mins<1) return 'just now';
  if(mins<60) return mins+'m ago';
  const h = Math.floor(mins/60);
  if(h<24) return h+'h ago';
  const days = Math.floor(h/24);
  return days+'d ago';
}
function isToday(ts){
  if(!ts) return false;
  const d = new Date(ts);
  if(isNaN(d)) return false;
  const now = new Date();
  return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
}

async function loadOrders(){
  document.getElementById('ledger').innerHTML = '<div class="loading">Loading orders…</div>';
  document.getElementById('feed').innerHTML = '<div class="loading">Loading…</div>';

  const { data, error } = await supabase.from('orders').select('*').order('created_at',{ascending:false,nullsFirst:false}).limit(100);

  if(error){
    setConn('err','Connection failed');
    document.getElementById('ledger').innerHTML = `<div class="error-box">Couldn't load orders:\n${error.message}\n\nLikely cause: RLS is on but there's no SELECT policy for the anon role.\n\ncreate policy "Allow read for dashboard" on orders for select to anon using (true);</div>`;
    document.getElementById('feed').innerHTML='';
    return;
  }
  orders = data || [];
  setConn('ok', `Live — ${orders.length} orders`);
  renderStats();
  renderLedger(currentFilter);
  renderFeed();
  renderStatsView();
}

function renderStats(){
  const todays = orders.filter(o=>isToday(o.created_at));
  const completed = orders.filter(o=>(o.status||'').toLowerCase()==='completed');
  const pending = orders.filter(o=>['pending','processing'].includes((o.status||'').toLowerCase()));
  const revenue = completed.reduce((s,o)=>s+(Number(o.amount)||0),0);
  document.getElementById('statOrders').textContent = todays.length;
  document.getElementById('statOrdersSub').textContent = `of ${orders.length} loaded`;
  document.getElementById('statPaid').textContent = completed.length;
  document.getElementById('paidRate').textContent = orders.length ? Math.round(completed.length/orders.length*100)+'%' : '—';
  document.getElementById('statPending').textContent = pending.length;
  document.getElementById('pendingRate').textContent = orders.length ? Math.round(pending.length/orders.length*100)+'%' : '—';
  document.getElementById('statRevenue').textContent = money(revenue);
}

function renderLedger(filter){
  currentFilter = filter;
  const q = (document.getElementById('searchBox').value||'').toLowerCase().trim();
  let rows = orders.filter(o=>{
    if(filter==='today'){ if(!isToday(o.created_at)) return false; }
    else if(filter!=='all' && (o.status||'').toLowerCase()!==filter) return false;
    if(q){
      const hay = `${o.phone_number||''} ${o.whatsapp_phone||''} ${o.ref||''}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const list = document.getElementById('ledger');
  if(rows.length===0){
    list.innerHTML = '<div class="empty">No orders match — new orders appear here automatically.</div>';
    return;
  }
  list.innerHTML = rows.map(o=>{
    const phone = o.phone_number || o.whatsapp_phone || 'Unknown';
    const detail = [o.network, o.bundle?o.bundle+'GB':null, o.capacity?o.capacity+'GB':null].filter(Boolean).join(' · ');
    return `
    <div class="order-card">
      <div class="order-avatar">${initials(phone)}</div>
      <div class="order-mid">
        <div class="order-phone">${phone}</div>
        <div class="order-meta">${o.ref || ('#'+o.id)}${detail?' · '+detail:''}</div>
      </div>
      <div class="order-right">
        <div class="order-amount">${money(o.amount)}</div>
        <span class="pill ${pillClass(o.status)}">${pillLabel(o.status)}</span>
        ${o.created_at ? `<div class="order-time">${timeAgo(o.created_at)}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function renderFeed(){
  const recent = orders.slice(0,12);
  const list = document.getElementById('feed');
  if(recent.length===0){ list.innerHTML='<div class="empty">No recent activity.</div>'; return; }
  const colorFor = s=>{
    s=(s||'').toLowerCase();
    if(s==='completed') return 'var(--green)';
    if(s==='processing') return 'var(--cyan)';
    if(s==='pending') return 'var(--amber)';
    return 'var(--red)';
  };
  const textFor = o=>{
    const phone = o.phone_number || o.whatsapp_phone || 'a customer';
    const s=(o.status||'').toLowerCase();
    if(s==='completed') return `Order <b>${o.ref||'#'+o.id}</b> completed for <b>${phone}</b> · ${money(o.amount)}`;
    if(s==='processing') return `Order <b>${o.ref||'#'+o.id}</b> processing for <b>${phone}</b>`;
    if(s==='pending') return `Awaiting payment — <b>${o.ref||'#'+o.id}</b> from <b>${phone}</b>`;
    return `Order <b>${o.ref||'#'+o.id}</b> flagged: ${o.status||'unknown'}`;
  };
  list.innerHTML = recent.map((o,i)=>`
    <div class="fe">
      <div class="fe-rail">
        <div class="fe-dot" style="background:${colorFor(o.status)};color:${colorFor(o.status)}"></div>
        ${i<recent.length-1?'<div class="fe-line"></div>':''}
      </div>
      <div style="flex:1">
        <div class="fe-bubble">${textFor(o)}</div>
        <div class="fe-foot"><span class="fe-tag">${o.network||'Bot'}</span><span class="fe-id">${o.created_at ? timeAgo(o.created_at) : '#'+o.id}</span></div>
      </div>
    </div>`).join('');
}

function renderStatsView(){
  const total = orders.length;
  const completed = orders.filter(o=>(o.status||'').toLowerCase()==='completed').length;
  const processing = orders.filter(o=>(o.status||'').toLowerCase()==='processing').length;
  const pending = orders.filter(o=>(o.status||'').toLowerCase()==='pending').length;
  const other = total - completed - processing - pending;

  document.getElementById('kpiTotal').textContent = total;
  document.getElementById('kpiRate').textContent = total ? Math.round(completed/total*100)+'%' : '—';

  const rows = [
    {label:'Completed', val:completed, color:'var(--green)'},
    {label:'Processing', val:processing, color:'var(--cyan)'},
    {label:'Pending', val:pending, color:'var(--amber)'},
    {label:'Other', val:other, color:'var(--red)'},
  ];
  document.getElementById('statusBars').innerHTML = rows.map(r=>`
    <div class="bar-row">
      <div class="bar-label">${r.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${total?Math.round(r.val/total*100):0}%;background:${r.color}"></div></div>
      <div class="bar-num">${r.val}</div>
    </div>`).join('');
}

document.querySelectorAll('.seg').forEach(seg=>{
  seg.addEventListener('click',()=>{
    document.querySelectorAll('.seg').forEach(s=>s.classList.remove('active'));
    seg.classList.add('active');
    renderLedger(seg.dataset.filter);
  });
});
document.getElementById('searchBox').addEventListener('input', ()=>renderLedger(currentFilter));
document.getElementById('refreshBtn').addEventListener('click', loadOrders);

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
  });
});

supabase.channel('orders-changes')
  .on('postgres_changes', { event:'*', schema:'public', table:'orders' }, ()=> loadOrders())
  .subscribe();

loadOrders();
</script>
</body>
</html>
